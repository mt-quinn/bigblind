<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0812" />
    <title>dangerguessr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Special+Elite&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%; height: 100%;
        background: #000;
        color: #f0f0ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html, body { min-height: 100dvh; overflow: hidden; }
      #root { height: 100dvh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }

      .phone-frame {
        position: relative;
        width: 100%;
        max-width: min(450px, calc(100dvh * 9 / 16));
        aspect-ratio: 9 / 16;
        margin: auto;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #0a0812;
      }
      @media (min-width: 769px) {
        .phone-frame {
          border-radius: 32px;
          box-shadow: 0 0 0 4px #1a1a1a, 0 0 0 6px #333, 0 12px 40px rgba(0,0,0,0.5);
        }
      }
      @media (max-width: 768px) {
        #root { align-items: stretch; justify-content: stretch; }
        .phone-frame {
          max-width: 100%;
          aspect-ratio: unset;
          height: 100%;
          min-height: 100%;
          max-height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
      }

      body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background:
          radial-gradient(circle at 16% 20%, rgba(232,197,71,0.12) 0%, transparent 42%),
          radial-gradient(circle at 86% 18%, rgba(180,50,50,0.1) 0%, transparent 45%),
          radial-gradient(circle at 54% 82%, rgba(110,198,255,0.06) 0%, transparent 46%);
        pointer-events: none;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
